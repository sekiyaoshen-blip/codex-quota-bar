name: Build

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check shell scripts
        run: |
          bash -n scripts/build.sh scripts/install.sh scripts/autostart-on.sh scripts/autostart-off.sh scripts/update.sh
          zsh -n scripts/follow.sh

      - name: Build app
        run: ./scripts/build.sh

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-quota-bar-${{ runner.arch }}
          path: dist/codex-quota-bar.zip
